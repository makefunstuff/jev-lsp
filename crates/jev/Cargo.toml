[package]
name = "jev"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "jev"
path = "src/main.rs"

[dependencies]
jev-core = { path = "../jev-core" }
serde_json.workspace = true

[dev-dependencies]
# The test backend implements `jev_core::model::Backend`, whose error type is `anyhow::Error`,
# and the scripted document store is locked from several threads.
anyhow.workspace = true
parking_lot = "0.12"

[lints.rust]
unsafe_code = "forbid"
