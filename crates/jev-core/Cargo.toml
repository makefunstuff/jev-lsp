[package]
name = "jev-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
license-file.workspace = true

[dependencies]
anyhow.workspace = true
parking_lot = "0.12"
# A real regex engine for the rules pass: `rules::lint` has to be able to report an
# uncompilable pattern, and a hand-rolled matcher is a bug farm (see the module doc).
regex = "1"
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2 = "0.10"
ureq = { version = "3", features = ["json"] }

[lints.rust]
unsafe_code = "forbid"
