name: release

# This file does not implement a release. `scripts/release-jev.sh` does, and every step below is
# that script, so a release made here and one made by hand on a laptop are the same asset names,
# the same contents and the same checksums. The matrix only decides which platform each job builds.
#
# A tag is the trigger, and the tag's annotation is the release note: this repository's commit
# style is a lowercase sentence and it is not going to become conventional commits, so nothing
# here needs a changelog generator. When the annotation is empty the script asks GitHub for its
# own generated notes instead (`.github` owns that fallback, not this file).
#
# `workflow_dispatch` runs the builds and skips the publish job, which is how a change to this
# file is tried and watched before any tag exists.
#
# Idempotent by construction: a re-run reuses the tag, re-uploads the assets to the existing
# release with `--clobber`, and never deletes a release, a tag or an asset. Notes already
# published are left as they are.
#
# No `RUSTFLAGS: -D warnings` here. `ci.yml` owns that bar for a commit, and a release is built
# with the same environment `scripts/release-jev.sh` uses by hand so the two cannot diverge.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  archive:
    name: archive ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native: `rustc -vV`'s host on this runner is the triple in the asset name.
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Native as well.
          - runner: macos-14
            target: aarch64-apple-darwin
          # Cross-built from macos-14, not native: the macOS SDK is universal, so an Intel
          # binary is a `--target` away. This is the one entry that needs `rustup target add`.
          - runner: macos-14
            target: x86_64-apple-darwin
            cross: true
          # No Windows entry, and not for lack of a runner: nothing in this repository has ever
          # been exercised there (docs/CURSOR.md says which platforms it was measured on), and an
          # untested archive on a release page is worse than a missing one.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-
      - name: rustup target ${{ matrix.target }}
        if: matrix.cross
        run: rustup target add ${{ matrix.target }}
      - name: the archive
        run: scripts/release-jev.sh build --target ${{ matrix.target }} --out target/dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-${{ matrix.target }}
          path: target/dist/*.tar.gz
          if-no-files-found: error

  vsix:
    name: extension (Cursor and VS Code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `editors/cursor/pack.sh` builds the VSIX with `zip` and `jq` alone: a VSIX is a ZIP, and
      # this extension has no dependencies, so no npm and no network are involved.
      - name: zip and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zip unzip
      - name: the extension
        run: scripts/release-jev.sh vsix --out target/dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix
          path: target/dist/*.vsix
          if-no-files-found: error

  publish:
    name: publish the release
    needs: [archive, vsix]
    # Only a tag publishes. A dispatch runs the two jobs above and stops here.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The only job in this repository that may write. The workflow default is `contents: read`.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUILT_BY: >-
        by the release workflow (.github/workflows/release.yml), one GitHub-hosted runner per
        platform, from the tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The tag object, so `assemble` can read the annotation that becomes the release note.
      # No `--force`: this checkout has no tags, and a fetch that cannot clobber anything cannot
      # move a tag that somebody else is relying on.
      - name: the tag annotation
        run: git fetch --tags origin
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: target/dist
          merge-multiple: true
      - name: what the runners built
        run: ls -l target/dist
      # Checksums and notes over everything the runners produced, in one directory, before
      # anything is published.
      - name: assemble
        run: scripts/release-jev.sh assemble --dir target/dist --built-by "$BUILT_BY"
      - name: publish
        run: scripts/release-jev.sh publish --dir target/dist --publish --built-by "$BUILT_BY"
      - name: the release, read back
        run: |
          gh release view "v$(scripts/release-jev.sh version)" \
            --repo "$GITHUB_REPOSITORY" \
            --json url,isDraft,assets \
            --jq '.url, (.assets[] | "  \(.name)  \(.size) bytes  \(.state)")'
