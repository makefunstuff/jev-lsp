name: ci

# What this covers, and what it cannot. A workflow that silently omits a row is worse than one
# that names the omission, so the omissions are here rather than in a comment somewhere else.
#
# Covered:
#   * `cargo build --release` and `cargo test`, warning-free. A warning is a failure, including
#     the ones `#[cfg(test)]` code raises — that is this repository's own bar, and RUSTFLAGS
#     below is how it is enforced rather than hoped for.
#   * the verification table, `verify/run-suite.sh`, under both Neovim versions it names
#     (0.12.5 and 0.12.1, the pair its own header uses). The suite starts and supervises its own
#     model stub, so it needs no service.
#
# Not covered, by name:
#   * the `omp_lsp` row needs the `omp` harness on a runner's PATH. The suite SKIPs that row
#     rather than failing it, and the log says which row it was.
#   * anything with a GUI. The Cursor/VS Code extension in `editors/cursor/` is exercised at the
#     protocol layer by the suite's own client; whether an editor paints a squiggle is not
#     something any headless job here can see (docs/CURSOR.md weighs what is and is not verified).
#   * the plugin's local-grep **fallback** (`grep` where `ripgrep` is missing,
#     `nvim/lua/jev/context.lua:288`). The runner installs `ripgrep` below because the plugin
#     prefers it and a developer's machine has it, and the fallback fails the `nvim_ui_test` row
#     wherever `rg` is absent — a defect in the fallback, reproduced locally, not something this
#     job covers.
#   * the `quality_eval` row measures a review against a real model. There is no API key in CI,
#     so the row reports `?` with its reason: never a pass, never a failure.
#   * the suite's own `rules_gate` row runs the same gate the step below runs, against the
#     suite's own model stub: `run-suite.sh` hands the row `JEV_DECIDE_BASE_URL` itself, so the
#     row reports `ok` here rather than skipping. The keyed check is the step below, which names
#     the `TYPESAFE_API_KEY` secret and reports NOT CHECKED without it.
#   * the gate itself needs a decide endpoint and a key. It is a step of the build-and-test job,
#     below, with the endpoint as a plain value and the key read from the `TYPESAFE_API_KEY`
#     repository secret — which does not exist yet, so the step reports NOT CHECKED, with the
#     reason, rather than a green step that proved nothing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A pull request's run is superseded by the next push to that PR, so cancelling is right there.
  # A push to `main` is a commit that deserves a verdict: this repository has several sessions
  # committing to `main`, and cancelling every run but the newest meant most commits never got
  # one — five runs in a row were cancelled before this line changed.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # A warning is a failure in this repository, in tests as well as in the binary.
  RUSTFLAGS: -D warnings

jobs:
  build-and-test:
    name: build and test, warning-free
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # History, so the rules gate below can name a base to diff against. One fetch of the
          # branch's own history is cheaper than the gate looking at the wrong files.
          fetch-depth: 0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      # No toolchain action: the runner image ships a stable Rust with rustup, and `rust-version`
      # in the manifests (1.75) is enforced by cargo itself when it resolves. One less third-party
      # action to pin and to keep current.
      - name: toolchain
        run: rustc --version && cargo --version
      - name: build
        run: cargo build --release --locked
      - name: test
        run: cargo test --locked
      # The repository's own rules, over the files this branch changes, through the shipped
      # `jev inspect --force` — the same pass the editor runs, so a gate finding and a sign-column
      # finding cannot disagree.
      #
      # The endpoint and the model are plain values, not secrets. The key is not, and it is read
      # from the `TYPESAFE_API_KEY` repository secret by the gate, whose default key file
      # (`~/.omp/agent/opencode.key`) does not exist on a runner. Without the secret this step is
      # a no-op with a reason: the gate exits 2, and 2 is reported here as NOT CHECKED rather
      # than as a failure or as a pass. GitHub cannot mark a step "skipped" once it has run, so
      # the reason goes to the run's summary and to a warning annotation, and the log says so.
      - name: the rules gate
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          # The gate's own defaults, written out: the route this repository uses for the decide
          # tier (docs/MODEL.md §8). Plain values on purpose — an endpoint is not a credential.
          JEV_DECIDE_WIRE: system_one
          JEV_DECIDE_BASE_URL: https://opencode.ai/zen/v1
          JEV_DECIDE_MODEL: jev-1.13
          JEV_DECIDE_TIMEOUT_MS: '15000'
        run: |
          set -eu
          # `verify/rules-gate.sh` is committed, and this guard is for a checkout that does not
          # have it — a fork, or a ref from before it landed. A gate that cannot run must not look
          # like a pass, so this says NOT CHECKED with the reason and never a green step.
          if [ ! -f verify/rules-gate.sh ]; then
            echo "::warning::the rules gate is NOT CHECKED: verify/rules-gate.sh is not in this checkout"
            {
              echo "### the rules gate: NOT CHECKED"
              echo
              echo "\`verify/rules-gate.sh\` is not in this checkout, so nothing ran. The decisions it"
              echo "would have asked for are unverified in this run."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The gate is a per-change instrument, so this step checks the files the change touches
          # and never the whole tree: a whole-tree run on this repository is either permanently
          # red on a finding that has been decided and is pending, or green while printing
          # findings — and neither can be told from a pass. `--diff-filter=d` drops deletions,
          # because the gate inspects files that exist.
          #
          # The base is the PR's, else the previous commit. When there is no history to diff
          # against — a shallow checkout, a fresh branch with one commit — this step does not fall
          # back to a whole-tree run: it says NOT CHECKED with the reason, below, and the reason
          # names the missing base.
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            base="origin/$GITHUB_BASE_REF"
          elif git rev-parse -q --verify HEAD^ >/dev/null 2>&1; then
            base="HEAD^"
          else
            base=""
          fi
          if [ -z "$base" ]; then
            echo "::warning::the rules gate is NOT CHECKED: no base to diff against in this checkout"
            {
              echo "### the rules gate: NOT CHECKED"
              echo
              echo "There is no base commit to diff against in this checkout (\`HEAD^\` does not"
              echo "resolve and this is not a pull request), and the gate is a per-change"
              echo "instrument — it is not run over the whole tree. The decisions it would have"
              echo "asked for are unverified in this run."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # No `|| true`: a base that will not diff is a real problem, and a step that carries on
          # anyway would check the wrong files and call it a pass.
          paths="$(git diff --diff-filter=d --name-only "$base" HEAD)"
          echo "changed since $base:"
          if [ -n "$paths" ]; then printf '  %s\n' $paths; else echo "  (nothing)"; fi
          set +e
          # shellcheck disable=SC2086  # the list is one path per word, and these paths have none
          report="$(bash verify/rules-gate.sh $paths 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$report"
          case "$rc" in
            0) echo "the rules gate ran: no finding cleared its floor" ;;
            1)
              echo "::error::the rules gate found something (exit 1) — see the findings above"
              exit 1
              ;;
            2)
              reason="$(printf '%s\n' "$report" | sed -n 's/^rules-gate: //p' | tail -1)"
              echo "::warning::the rules gate did NOT run (exit 2): ${reason:-no reason given}"
              {
                echo "### the rules gate: NOT CHECKED"
                echo
                echo "\`verify/rules-gate.sh\` exited 2, which is its code for *could not run* — not for"
                echo "\"clean\" and not for \"found something\". Reason:"
                echo
                echo '```'
                printf '%s\n' "$report"
                echo '```'
                echo
                echo "The decisions this gate would have asked for are unverified in this run."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *) echo "::error::the rules gate exited $rc, which is not one of its three codes"; exit 1 ;;
          esac

  verify:
    name: verification (${{ matrix.row }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The narrow run first: it is the plugin's own rows, and a failure there is readable
          # on its own. The full run owns the whole table, and re-runs these rows inside it.
          - row: nvim-only
            nvim_only: '1'
          - row: full-table
            nvim_only: '0'
    env:
      NVIM_ONLY: ${{ matrix.nvim_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      # The two versions the suite's own default names, from the release tarballs rather than a
      # distro package: `apt`'s Neovim is older than the 0.12 the plugin requires.
      #
      # 0.12.5 also goes on `PATH`, because two consumers want a bare `nvim` rather than the
      # `NVIM_BINS` list: `verify/probes/run.sh` runs `nvim --headless` per probe, and the plugin's
      # own local grep falls back through `vim.fn.executable`. Without this the `probes` row
      # failed seven ways on the first run of this job, and it was this workflow's gap, not a
      # product defect.
      - name: neovim 0.12.5 and 0.12.1
        run: |
          set -eu
          curl -fsSL -o /tmp/nvim-0.12.5.tar.gz https://github.com/neovim/neovim/releases/download/v0.12.5/nvim-linux-x86_64.tar.gz
          curl -fsSL -o /tmp/nvim-0.12.1.tar.gz https://github.com/neovim/neovim/releases/download/v0.12.1/nvim-linux-x86_64.tar.gz
          sudo mkdir -p /opt/nvim-0.12.5 /opt/nvim-0.12.1
          sudo tar -xzf /tmp/nvim-0.12.5.tar.gz -C /opt/nvim-0.12.5 --strip-components=1
          sudo tar -xzf /tmp/nvim-0.12.1.tar.gz -C /opt/nvim-0.12.1 --strip-components=1
          /opt/nvim-0.12.5/bin/nvim --version | head -1
          /opt/nvim-0.12.1/bin/nvim --version | head -1
          # What the plugin's local grep will find, printed so a later failure can be read without
          # a second run. The fallback order is `rg`, then `grep` (nvim/lua/jev/context.lua).
          if command -v rg >/dev/null 2>&1; then rg --version | head -1; else echo "no ripgrep: the grep fallback is what runs"; fi
          if command -v grep >/dev/null 2>&1; then grep --version | head -1; else echo "no grep either"; fi
          echo "/opt/nvim-0.12.5/bin" >> "$GITHUB_PATH"
      # `/tmp/jev-ws` is where the suite's `lsp_client` row opens its workspace, and nothing
      # creates it: on a fresh runner the row answered `--workspace is not a directory` (exit 2)
      # on the first run of this job.
      - name: the workspace the suite's client row wants
        run: mkdir -p /tmp/jev-ws
      # `ripgrep`, because the plugin's local grep prefers it and a developer's machine has it
      # (nvim/lua/jev/context.lua:283, `rg` first and `grep` as the fallback). Without it the
      # `nvim_ui_test` row fails on both Neovim versions, and the failing check is the one about
      # the client having grepped locally — the fallback returns no context. That is a defect in
      # the fallback, not in this job, and installing `rg` means **CI does not exercise the
      # fallback**: reproduce it with `env PATH=<a PATH with no rg> NVIM_ONLY=1
      # bash verify/run-suite.sh /tmp/log`, which reports `[nvim_ui] 1 failure(s)`.
      - name: ripgrep, which the plugin's grep prefers
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          rg --version | head -1
      - name: the verification table
        run: |
          set -eu
          set +e
          NVIM_BINS="/opt/nvim-0.12.5/bin/nvim /opt/nvim-0.12.1/bin/nvim" \
            bash verify/run-suite.sh /tmp/suite.log
          table=$?
          set -e
          echo "verify/run-suite.sh exited $table"
          sed -n '/^=== summary ===$/,$p' /tmp/suite.log
          # Two conditions, the exit code first: `run-suite.sh` aggregates the rows' recorded
          # `EXIT=` values into its own exit code, so a red row is a red step and this is the
          # primary verdict. The text grep stays as the second net, for a row that printed `FAIL`
          # without a failing exit — which is what the summary looked like before `007cbb6`.
          if [ "$table" -ne 0 ]; then
            echo "::error::the verification table exited $table; the whole log is attached to this run"
            exit 1
          fi
          if sed -n '/^=== summary ===$/,$p' /tmp/suite.log | grep -q '^FAIL '; then
            echo "::error::a row printed FAIL although the table exited 0; the whole log is attached to this run"
            exit 1
          fi
          # `?` is a row that could not run. It carries its own reason in the log, and this step
          # names it rather than letting it read as a pass. `quality_eval` is the one in CI: there
          # is no API key here, so it reports `?` with that reason. The keyed check is the
          # build-and-test job's gate step, which names the `TYPESAFE_API_KEY` secret and reports
          # NOT CHECKED without it.
          if sed -n '/^=== summary ===$/,$p' /tmp/suite.log | grep -q '^? '; then
            echo "::notice::rows that could not run in CI (each names its reason in the log):"
            # Inside this branch there is at least one match, so nothing here needs `|| true`.
            sed -n '/^=== summary ===$/,$p' /tmp/suite.log | grep '^? '
          fi
      - name: the summary, in the run
        if: always()
        run: sed -n '/^=== summary ===$/,$p' /tmp/suite.log >> "$GITHUB_STEP_SUMMARY"
      - name: the whole log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: suite-log-${{ matrix.row }}
          path: /tmp/suite.log
          if-no-files-found: error
