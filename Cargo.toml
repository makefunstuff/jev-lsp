[workspace]
resolver = "2"
members = ["crates/jev-core", "crates/jev-lsp", "crates/jev"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
# Read by `cargo binstall` (it looks the releases up under the repository linked here) and by
# anyone deciding where a downloaded crate came from. The released crates inherit it.
repository = "https://github.com/makefunstuff/jev-lsp"
# The licence of the whole workspace, named once: the crates inherit it, `LICENSE` at the
# repository root is the text, and `cargo package`/crates.io/`cargo binstall` read this field.
license = "MIT"
# The text itself, so `cargo package` puts it *inside* the crate archive: cargo only auto-includes
# a licence file found in the package root, and this one is at the workspace root, which is why
# `cargo package --list -p jev-lsp` listed no `LICENSE` before this line existed.
license-file = "LICENSE"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The rules are authored by hand, and a hand-authored rule file wants readable prose and a
# regex that is not escaped twice. `serde_yaml` parses `jev.rules/1` files written as YAML
# into the same structures `serde_json` parses the JSON spelling into, so the loader reads
# both and nothing downstream knows which spelling a rule arrived in.
serde_yaml = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
