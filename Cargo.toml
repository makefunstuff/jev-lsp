[workspace]
resolver = "2"
members = ["crates/jev-core", "crates/jev-lsp", "crates/jev"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
# Read by `cargo binstall` (it looks the releases up under the repository linked here) and by
# anyone deciding where a downloaded crate came from. The released crates inherit it.
repository = "https://github.com/makefunstuff/jev-lsp"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
