<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<title id="t">jev-lsp steering a coding agent inside OMP, a non-Neovim LSP client</title>
<desc id="d">A terminal window. The user asks for a handler; the agent writes handler.rs with fs::read_to_string(path).unwrap() on line 4. OMP then calls its lsp tool: workspace/executeCommand jev.inspect answers candidates 1, considered 1, and textDocument diagnostics answers one warning on line 4 column 5 — jev Unwrap in a request handler, A handler must not unwrap; return the error instead. — reachable (p=0.90), finding 83f83e989c25. The agent edits the line and re-pulls diagnostics, which answer OK. A second pane shows the repository rule that fired (the jev.rules/1 document for no-unwrap-in-handlers) with the .omp/lsp.json entry that registers the server for a non-Neovim harness. A footer states which lines are recorded and which are illustrative.</desc>
<rect width="1200" height="700" fill="#0e1117"/>
<rect x="14" y="14" width="1172" height="596" rx="12" fill="#0b0f16" stroke="#2b323c"/>
<path d="M 26 14 h 1148 a 12 12 0 0 1 -12 12 h -1148 a 12 12 0 0 1 -12 -12 z" fill="#151a22"/>
<rect x="26" y="36" width="1148" height="12" fill="#151a22"/>
<line x1="14" y1="48" x2="1186" y2="48" stroke="#2b323c"/>
<circle cx="38.0" cy="31" r="5" fill="#3a424e"/>
<circle cx="54.0" cy="31" r="5" fill="#3a424e"/>
<circle cx="70.0" cy="31" r="5" fill="#3a424e"/>
<text x="92" y="36" font-size="14" fill="#d6dde6">omp — /tmp/jev-omp-rules.PRAyMS</text>
<text x="1168" y="36" font-size="13" fill="#97a3b0" text-anchor="end">lsp tool → jev-lsp (stdio)</text>
<line x1="740" y1="48" x2="740" y2="610" stroke="#232a33"/>
<rect x="30" y="480.0" width="698" height="43.0" rx="4" fill="#f0b849" fill-opacity="0.13"/>
<rect x="30" y="480.0" width="3" height="43.0" rx="1.5" fill="#f0b849"/>
<line x1="758" y1="407.2" x2="1166" y2="407.2" stroke="#232a33"/>
<g font-size="14">
<text x="40.0" y="66.0" xml:space="preserve"><tspan x="40.0" fill="#97a3b0">$ </tspan><tspan x="56.9" fill="#d6dde6">write a handler in handler.rs — read the path, return the body</tspan></text>

<text x="40.0" y="105.0" xml:space="preserve"><tspan x="40.0" fill="#6cb6ff">● </tspan><tspan x="56.9" fill="#d6dde6">write</tspan><tspan x="99.1" fill="#97a3b0">  handler.rs  (+6 lines)</tspan></text>
<text x="48.5" y="124.5" xml:space="preserve"><tspan x="48.5" fill="#d6dde6">use std::fs;</tspan></text>

<text x="48.5" y="163.5" xml:space="preserve"><tspan x="48.5" fill="#d6dde6">pub fn handle(path: &amp;str) -&gt; String {</tspan></text>
<text x="56.9" y="183.0" xml:space="preserve"><tspan x="56.9" fill="#d6dde6">let body = fs::read_to_string(path).unwrap();</tspan></text>
<text x="56.9" y="202.5" xml:space="preserve"><tspan x="56.9" fill="#d6dde6">body</tspan></text>
<text x="48.5" y="222.0" xml:space="preserve"><tspan x="48.5" fill="#d6dde6">}</tspan></text>

<text x="40.0" y="261.0" xml:space="preserve"><tspan x="40.0" fill="#6cb6ff">● </tspan><tspan x="56.9" fill="#d6dde6">lsp</tspan><tspan x="82.2" fill="#97a3b0">  action=request  file=handler.rs  query=workspace/executeCommand</tspan></text>
<text x="48.5" y="280.5" xml:space="preserve"><tspan x="48.5" fill="#97a3b0">payload </tspan><tspan x="116.0" fill="#d6dde6">{"command":"jev.inspect","arguments":[{"path":</tspan></text>
<text x="56.9" y="300.0" xml:space="preserve"><tspan x="56.9" fill="#d6dde6">"/tmp/jev-omp-rules.PRAyMS/handler.rs","force":true}]}</tspan></text>
<text x="48.5" y="319.5" xml:space="preserve"><tspan x="48.5" fill="#97a3b0">jev-lsp ← workspace/executeCommand:</tspan></text>
<text x="48.5" y="339.0" xml:space="preserve"><tspan x="48.5" fill="#d6dde6">{ "candidates": 1, "considered": 1, "ok": true, "skipped": [],</tspan></text>
<text x="56.9" y="358.5" xml:space="preserve"><tspan x="56.9" fill="#d6dde6">"schema": "jev.result/1",</tspan></text>
<text x="56.9" y="378.0" xml:space="preserve"><tspan x="56.9" fill="#d6dde6">"findings": [ { "id": "83f83e989c25", "line": 3, "start_col": 4,</tspan></text>
<text x="73.8" y="397.5" xml:space="preserve"><tspan x="73.8" fill="#d6dde6">"severity": "warning", "verb": "fix" } ] }</tspan></text>

<text x="40.0" y="436.5" xml:space="preserve"><tspan x="40.0" fill="#6cb6ff">● </tspan><tspan x="56.9" fill="#d6dde6">lsp</tspan><tspan x="82.2" fill="#97a3b0">  action=diagnostics  file=handler.rs</tspan></text>
<text x="48.5" y="456.0" xml:space="preserve"><tspan x="48.5" fill="#d6dde6">1 warning(s):</tspan></text>
<text x="48.5" y="475.5" xml:space="preserve"><tspan x="48.5" fill="#97a3b0"># handler.rs</tspan></text>
<text x="48.5" y="495.0" xml:space="preserve"><tspan x="48.5" fill="#f0b849">4:5 [warning] [jev] Unwrap in a request handler — A handler must not unwrap;</tspan></text>
<text x="48.5" y="514.5" xml:space="preserve"><tspan x="48.5" fill="#f0b849">return the error instead. — reachable (p=0.90) (83f83e989c25)</tspan></text>

<text x="40.0" y="553.5" xml:space="preserve"><tspan x="40.0" fill="#6cb6ff">● </tspan><tspan x="56.9" fill="#d6dde6">edit</tspan><tspan x="90.7" fill="#97a3b0">  handler.rs</tspan><tspan x="192.1" fill="#d6dde6">  — return the error instead of unwrapping</tspan></text>
<text x="40.0" y="573.0" xml:space="preserve"><tspan x="40.0" fill="#6cb6ff">● </tspan><tspan x="56.9" fill="#d6dde6">lsp</tspan><tspan x="82.2" fill="#97a3b0">  action=diagnostics  file=handler.rs</tspan></text>
<text x="48.5" y="592.5" xml:space="preserve"><tspan x="48.5" fill="#4ac26b">OK</tspan></text>
<text x="758.0" y="66.0" xml:space="preserve"><tspan x="758.0" fill="#97a3b0">.jev/rules/example.json</tspan></text>

<text x="758.0" y="105.0" xml:space="preserve"><tspan x="758.0" fill="#6cb6ff">{ "schema"</tspan><tspan x="842.5" fill="#d6dde6">: "jev.rules/1",</tspan></text>
<text x="766.5" y="124.5" xml:space="preserve"><tspan x="766.5" fill="#6cb6ff">"rules"</tspan><tspan x="825.6" fill="#d6dde6">: [</tspan></text>
<text x="774.9" y="144.0" xml:space="preserve"><tspan x="774.9" fill="#6cb6ff">{ "id"</tspan><tspan x="825.6" fill="#d6dde6">: "no-unwrap-in-handlers",</tspan></text>
<text x="783.4" y="163.5" xml:space="preserve"><tspan x="783.4" fill="#6cb6ff">"title"</tspan><tspan x="842.5" fill="#d6dde6">: "Unwrap in a request handler",</tspan></text>
<text x="783.4" y="183.0" xml:space="preserve"><tspan x="783.4" fill="#6cb6ff">"text"</tspan><tspan x="834.0" fill="#d6dde6">: </tspan><tspan x="851.0" fill="#f0b849">"A handler must not unwrap;</tspan></text>
<text x="791.8" y="202.5" xml:space="preserve"><tspan x="791.8" fill="#f0b849">return the error instead.",</tspan></text>
<text x="783.4" y="222.0" xml:space="preserve"><tspan x="783.4" fill="#6cb6ff">"severity"</tspan><tspan x="867.9" fill="#d6dde6">: "warning",</tspan></text>
<text x="783.4" y="241.5" xml:space="preserve"><tspan x="783.4" fill="#6cb6ff">"applies_to"</tspan><tspan x="884.8" fill="#d6dde6">: ["**/*.rs"],</tspan></text>
<text x="783.4" y="261.0" xml:space="preserve"><tspan x="783.4" fill="#6cb6ff">"inspection"</tspan><tspan x="884.8" fill="#d6dde6">: {</tspan></text>
<text x="791.8" y="280.5" xml:space="preserve"><tspan x="791.8" fill="#6cb6ff">"kind"</tspan><tspan x="842.5" fill="#d6dde6">: "regex",</tspan></text>
<text x="791.8" y="300.0" xml:space="preserve"><tspan x="791.8" fill="#6cb6ff">"pattern"</tspan><tspan x="867.9" fill="#d6dde6">: "\\.unwrap\\\\(\\)" },</tspan></text>
<text x="783.4" y="319.5" xml:space="preserve"><tspan x="783.4" fill="#6cb6ff">"judgement"</tspan><tspan x="876.3" fill="#d6dde6">: {</tspan></text>
<text x="791.8" y="339.0" xml:space="preserve"><tspan x="791.8" fill="#6cb6ff">"question"</tspan><tspan x="876.3" fill="#d6dde6">: "Is this unwrap</tspan></text>
<text x="800.2" y="358.5" xml:space="preserve"><tspan x="800.2" fill="#d6dde6">reachable from a request handler?",</tspan></text>
<text x="791.8" y="378.0" xml:space="preserve"><tspan x="791.8" fill="#6cb6ff">"min_probability"</tspan><tspan x="935.5" fill="#d6dde6">: 0.75 },</tspan></text>
<text x="783.4" y="397.5" xml:space="preserve"><tspan x="783.4" fill="#6cb6ff">"verb_hint"</tspan><tspan x="876.3" fill="#d6dde6">: "fix" } ] }</tspan></text>

<text x="758.0" y="436.5" xml:space="preserve"><tspan x="758.0" fill="#97a3b0">.omp/lsp.json</tspan><tspan x="867.9" fill="#97a3b0">  (the fixture's own cwd config)</tspan></text>
<text x="758.0" y="456.0" xml:space="preserve"><tspan x="758.0" fill="#d6dde6">{ "servers": { "jev-lsp": {</tspan></text>
<text x="766.5" y="475.5" xml:space="preserve"><tspan x="766.5" fill="#6cb6ff">"command"</tspan><tspan x="842.5" fill="#d6dde6">: "/path/to/jev-lsp/</tspan></text>
<text x="783.4" y="495.0" xml:space="preserve"><tspan x="783.4" fill="#d6dde6">target/release/jev-lsp",</tspan></text>
<text x="766.5" y="514.5" xml:space="preserve"><tspan x="766.5" fill="#6cb6ff">"args"</tspan><tspan x="817.1" fill="#d6dde6">: ["--stdio"],</tspan></text>
<text x="766.5" y="534.0" xml:space="preserve"><tspan x="766.5" fill="#6cb6ff">"fileTypes"</tspan><tspan x="859.4" fill="#d6dde6">: [".rs"],</tspan></text>
<text x="766.5" y="553.5" xml:space="preserve"><tspan x="766.5" fill="#6cb6ff">"rootMarkers"</tspan><tspan x="876.3" fill="#d6dde6">: [".git"] } } }</tspan></text>
</g>
<g font-size="12" fill="#97a3b0">
<text x="22" y="616.0" xml:space="preserve">Recorded, not staged: the lsp tool calls and their arguments, the jev.inspect JSON (trimmed), the diagnostic text, the finding id</text>
<text x="22" y="633.5" xml:space="preserve">83f83e989c25 and its severity are what OMP's lsp tool returned for verify/omp_lsp.sh's fixture (/tmp/w2-omp.log, fixture</text>
<text x="22" y="651.0" xml:space="preserve">/tmp/jev-omp-rules.PRAyMS); a replay of that script reproduced them byte-for-byte. The rule is the fixture's .jev/rules/example.json,</text>
<text x="22" y="668.5" xml:space="preserve">the entry its .omp/lsp.json. Illustrative: the user's request, the file write, the edit. The closing OK: a re-run with that line fixed.</text>
<text x="22" y="686.0" xml:space="preserve">Rule JSON, over-long lines and paths are wrapped or genericised to fit the pane.</text>
</g>
</svg>
